#version: '3.8'

services:
  # PostgreSQL Database - persistent storage for all governance data
  postgres:
    image: postgres:15-alpine
    container_name: governance-postgres
    environment:
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: governance123
      POSTGRES_DB: governance 
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - governance-network
    restart: unless-stopped

  # OPA (Open Policy Agent) - Policy Decision Point
  opa:
    image: openpolicyagent/opa:latest
    container_name: governance-opa
    ports:
      - "8181:8181"
    volumes:
      - ./opa-policies:/policies
    command: run --server --addr=0.0.0.0:8181 /policies
    networks:
      - governance-network
    restart: unless-stopped

  # Apicurio Registry - Schema management (ODCS compliant)
  apicurio-registry:
    image: apicurio/apicurio-registry-mem:latest-snapshot
    container_name: governance-registry
    ports:
      - "8080:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
      REGISTRY_LOG_LEVEL: INFO
    networks:
      - governance-network
    restart: unless-stopped

  # Main Governance API & Dashboard - Node.js backend 
  governance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: governance-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://governance:governance123@postgres:5432/governance 
      OPA_URL: http://opa:8181
      APICURIO_REGISTRY_URL: http://apicurio-registry:8080
      LOG_LEVEL: info
      SECRET_KEY: your-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source code for development (auto-reload)
      - ./src:/app/src
      - ./public:/app/public
      # Generated data contracts and schemas
      - ./generated:/app/generated
    networks:
      - governance-network
    restart: unless-stopped

  # pgAdmin - Optional database UI for inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: governance-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stocks-charles.se
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - governance-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  governance-network:
    driver: bridge
